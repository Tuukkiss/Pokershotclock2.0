<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shot Clock">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Poker Shot Clock</title>
  <style>
    :root { color-scheme: dark; --bg:#08090c; --fg:#f5f6f8; --muted:#555b66; --warn:#ffbd4a; --danger:#ff4d5e; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); }
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--fg); user-select:none; touch-action:manipulation; }
    #surface { position:fixed; inset:0; display:grid; place-items:center; padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); cursor:pointer; outline:none; }
    #time { font-size:clamp(9rem, 42vw, 25rem); line-height:.85; font-weight:650; letter-spacing:-.085em; font-variant-numeric:tabular-nums; transform:scale(1); transition:color .18s ease; will-change:transform; }
    #surface.running #time { animation: breathe 1.15s ease-in-out infinite alternate; }
    #surface.warning #time { color:var(--warn); animation: warningPulse .55s ease-in-out infinite alternate; }
    #surface.expired #time { color:var(--danger); animation: none; }
    #hint { position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:0; right:0; text-align:center; color:var(--muted); font-size:11px; letter-spacing:.16em; text-transform:uppercase; pointer-events:none; }
    #status { position:fixed; top:calc(18px + env(safe-area-inset-top)); left:0; right:0; text-align:center; color:#353a44; font-size:10px; letter-spacing:.2em; text-transform:uppercase; pointer-events:none; }
    @keyframes breathe { from { transform:scale(.94); } to { transform:scale(1.045); } }
    @keyframes warningPulse { from { transform:scale(.96); opacity:.82; } to { transform:scale(1.06); opacity:1; } }
    @media (orientation:landscape) { #time { font-size:min(55vw, 68vh); } }
    @media (prefers-reduced-motion:reduce) { #surface.running #time, #surface.warning #time { animation:none; } }
  </style>
</head>
<body>
  <main id="surface" role="button" tabindex="0" aria-label="Poker shot clock. Tap to start; tap again to reset.">
    <div id="time" aria-live="off">30</div>
  </main>
  <div id="status">READY</div>
  <div id="hint">Tap to start · Tap again to reset</div>
  <script>
    (() => {
      const surface = document.getElementById('surface');
      const timeEl = document.getElementById('time');
      const statusEl = document.getElementById('status');
      const hintEl = document.getElementById('hint');
      const DEFAULT_TIME = 30;
      let remaining = DEFAULT_TIME;
      let running = false;
      let expired = false;
      let lastTick = 0;
      let raf = 0;

      function render() {
        timeEl.textContent = Math.max(0, Math.ceil(remaining));
        surface.classList.toggle('running', running && !expired && remaining > 10);
        surface.classList.toggle('warning', running && !expired && remaining <= 10 && remaining > 0);
        surface.classList.toggle('expired', expired);
        statusEl.textContent = expired ? 'TIME' : running ? 'RUNNING' : 'READY';
        hintEl.textContent = running ? 'Tap anywhere to reset to 30' : 'Tap anywhere to start';
      }

      function tick(now) {
        if (!running) return;
        if (!lastTick) lastTick = now;
        remaining -= (now - lastTick) / 1000;
        lastTick = now;
        if (remaining <= 0) {
          remaining = 0;
          running = false;
          expired = true;
          cancelAnimationFrame(raf);
          if (navigator.vibrate) navigator.vibrate([180, 100, 180]);
        } else {
          raf = requestAnimationFrame(tick);
        }
        render();
      }

      function start() {
        remaining = DEFAULT_TIME;
        expired = false;
        running = true;
        lastTick = 0;
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(tick);
        render();
      }

      function reset() {
        running = false;
        expired = false;
        remaining = DEFAULT_TIME;
        lastTick = 0;
        cancelAnimationFrame(raf);
        render();
      }

      function handleTap() {
        if (running || expired) reset();
        else start();
      }

      surface.addEventListener('pointerup', (event) => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        event.preventDefault();
        handleTap();
      });
      surface.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          handleTap();
        }
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && running) {
          lastTick = 0;
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(tick);
        }
      });
      render();
      if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    })();
  </script>
</body>
</html>
